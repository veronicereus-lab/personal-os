<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Personal OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<meta name="theme-color" content="#1D1418">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..650&family=Figtree:wght@400;600&display=swap">
<style>
  :root{--ground:#FBEEF1;--card:#FFFAFB;--ink:#2E1F25;--mid:#5E4952;--line:#F0D5DC;--accent:#C25A7C;--shadow:rgba(120,40,70,.10)}
  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--ground:#1D1418;--card:#271C21;--ink:#F6E7EC;--mid:#D2BBC3;--line:#3E2C34;--accent:#EE9DB5;--shadow:rgba(0,0,0,.35)}}
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--ground);color:var(--ink);font:16px/1.5 "Figtree",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}
  main{width:100%;max-width:560px;padding:32px 16px}
  h1{font:600 2.2rem/1.1 "Fraunces",Georgia,serif;margin:0 0 .3rem}
  p{color:var(--mid);margin:0 0 1.6rem}
  a.go{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.2rem;margin:0 0 12px;box-shadow:0 1px 2px var(--shadow)}
  a.go b{display:block;font:600 1.2rem "Fraunces",Georgia,serif}
  a.go span{color:var(--mid);font-size:.92rem}
  a.go:hover,a.go:focus-visible{border-color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Personal OS</h1>
  <p>Tuyo, sin intermediarios.</p>
  <a class="go" href="personal-os.html"><b>🌸 Mi OS</b><span>Hoy, Estado, Rumbo y Sistema. Tus datos viven en tu base de datos.</span></a>
</main>
</body>
</html>
